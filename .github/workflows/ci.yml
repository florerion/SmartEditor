name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit and integration tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-unit
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright OS dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browser
        timeout-minutes: 10
        env:
          DEBUG: pw:install
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Install attempt ${attempt}/3"
            if npx playwright install chromium; then
              exit 0
            fi

            echo "Install failed on attempt ${attempt}. Cleaning Playwright cache before retry..."
            rm -rf "$HOME/.cache/ms-playwright/chromium-"* "$HOME/.cache/ms-playwright/.links"
          done

          echo "Playwright browser install failed after 3 attempts"
          exit 1

      - name: Run end-to-end tests
        run: npm run test:e2e
