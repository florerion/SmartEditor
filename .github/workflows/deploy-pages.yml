name: Deploy Demo to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # postinstall automatically downloads the pinned draw.io webapp to vendor/drawio/
        run: npm ci

      - name: Build library
        # build also copies vendor/drawio/ → dist/drawio/
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/demo _site/dist
          cp -r demo/* _site/demo/
          cp -r dist/* _site/dist/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./demo/">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>md-wysiwyg-editor demo</title>
          </head>
          <body>
            <p>Redirecting to <a href="./demo/">demo</a>...</p>
          </body>
          </html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
